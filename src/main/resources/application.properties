spring.application.name=ms-barriodigital-catalog
server.port=8085

# ========== MYSQL ==========
# Base propia de catalog (no comparte tablas con requests)
# Variable propia CATALOG_DB_NAME para no tomar el DB_NAME de requests si está definido en el entorno
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${CATALOG_DB_NAME:barriodigital_catalog}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA ==========
# update: Hibernate crea o ajusta las tablas según las entidades
spring.jpa.hibernate.ddl-auto=update
# Cierra la conexión al terminar el servicio, no al terminar la respuesta HTTP
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
